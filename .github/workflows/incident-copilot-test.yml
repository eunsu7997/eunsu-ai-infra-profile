name: incident-copilot-test
on:
  push:
    branches: ["sk-hynix-portfolio"]
    paths:
      - "incident-copilot/**"
      - ".github/workflows/incident-copilot-test.yml"
  pull_request:
    paths:
      - "incident-copilot/**"
      - ".github/workflows/incident-copilot-test.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incident-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Validate Docker Compose
        run: docker compose config -q
      - name: Build application image
        run: docker build -t incident-copilot:ci .
      - name: Smoke test container
        run: |
          docker run -d --name incident-copilot-ci -p 8000:8000 incident-copilot:ci
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -X POST http://127.0.0.1:8000/analyze -H 'Content-Type: application/json' -d '{"service":"gateway","logs":"upstream connection refused"}' | tee /tmp/analyze.json
          grep -q '"severity":"HIGH"' /tmp/analyze.json
          curl -fsSL http://127.0.0.1:8000/metrics/ | grep -q incident_analyses_total
      - name: Container logs
        if: always()
        run: docker logs incident-copilot-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f incident-copilot-ci || true
