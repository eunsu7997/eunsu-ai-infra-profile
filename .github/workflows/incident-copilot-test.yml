name: incident-copilot-test
on:
  push:
    branches: ["sk-hynix-portfolio"]
    paths:
      - "incident-copilot/**"
      - ".github/workflows/incident-copilot-test.yml"
  pull_request:
    paths:
      - "incident-copilot/**"
      - ".github/workflows/incident-copilot-test.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incident-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
