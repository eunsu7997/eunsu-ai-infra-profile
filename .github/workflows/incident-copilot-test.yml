name: incident-copilot-test
on:
  push:
    branches: ["sk-hynix-portfolio"]
    paths:
      - "incident-copilot/**"
  pull_request:
    paths:
      - "incident-copilot/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incident-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
